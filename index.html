<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FASHION PLACE - ERP Login</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(135deg,#07111f 0 50%,#f8fafc 50%);display:flex;align-items:center;justify-content:center;padding:20px;color:#0f172a}.card{width:min(430px,100%);background:#fff;border-radius:22px;padding:34px;box-shadow:0 24px 70px #0f172a35}.brand{text-align:center;margin-bottom:26px}.brand img{width:64px;height:64px;object-fit:contain;border-radius:16px}.brand h1{font-size:22px;margin:10px 0 2px}.brand p{margin:0;color:#64748b;font-size:12px;letter-spacing:2px}.sub{color:#64748b;margin-bottom:22px;text-align:center}label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}input{width:100%;height:50px;border:1px solid #dbe3ec;border-radius:11px;padding:0 14px;font-size:15px;background:#f8fafc}input:focus{outline:0;border-color:#f5a623;box-shadow:0 0 0 4px #f5a62324;background:#fff}button{width:100%;height:50px;margin-top:20px;border:0;border-radius:11px;background:linear-gradient(135deg,#f5a623,#f97316);color:#fff;font-weight:800;font-size:15px;cursor:pointer}.error{display:none;background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:10px;padding:11px 13px;font-size:13px;font-weight:600;margin-bottom:14px}.foot{text-align:center;color:#94a3b8;font-size:12px;margin-top:22px}@media(max-width:600px){body{background:#f8fafc}.card{padding:26px 20px}}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><img src="fp.logo.jpg" alt="FASHION PLACE"><h1>FASHION PLACE</h1><p>BUSINESS ERP</p></div>
    <div class="sub">Apne account se sign in karein</div>
    <div id="error" class="error"></div>
    <form id="loginForm">
      <label for="email">Email address</label><input id="email" type="email" autocomplete="username" required>
      <label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required>
      <button id="submit" type="submit">Sign In</button>
    </form>
    <div class="foot">FASHION PLACE ERP · Powered by A.A.Q. Solution &amp; Outsourcing</div>
  </main>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig={apiKey:"AIzaSyBMG7a3ZeVsekufoqlFbXVsWe7DjzHulxU",authDomain:"fpin-d022f.firebaseapp.com",projectId:"fpin-d022f",storageBucket:"fpin-d022f.firebasestorage.app",messagingSenderId:"576644637851",appId:"1:576644637851:web:093e427cf4e46485d6923e",measurementId:"G-XCRXZT72MQ"};
    firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore();
    const error=document.getElementById('error'),button=document.getElementById('submit');
    function showError(message){error.textContent=message;error.style.display='block';button.disabled=false;button.textContent='Sign In';}
    function roleName(role){return ['main_admin','manager','inventory_user','sales_user','hr_user','accountant','employee','user'].includes(role)?role:'user';}
    document.getElementById('loginForm').addEventListener('submit',async event=>{
      event.preventDefault();error.style.display='none';button.disabled=true;button.textContent='Signing in…';
      const email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('password').value;
      try{
        const credential=await auth.signInWithEmailAndPassword(email,password),firebaseUser=credential.user;
        const users=await db.collection('users').where('email','==',email).limit(1).get();
        let user;
        if(!users.empty){const doc=users.docs[0];user={id:doc.id,...doc.data()};}
        else{
          const employees=await db.collection('employees').where('email','==',email).limit(1).get();
          const employee=employees.empty?null:employees.docs[0].data();
          const existing=await db.collection('users').limit(1).get();
          const role=roleName(employee&&employee.role||(existing.empty?'main_admin':'employee'));
          const roles=[role].concat(employee&&employee.roles||[]).filter((r,i,a)=>a.indexOf(r)===i);
          const ref=await db.collection('users').add({name:employee&&employee.name||firebaseUser.displayName||email,email,role,roles,status:'active',authUid:firebaseUser.uid,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
          user={id:ref.id,name:employee&&employee.name||firebaseUser.displayName||email,email,role,roles,status:'active'};
        }
        if(user.status==='disabled'){await auth.signOut();throw {code:'disabled'};}
        const role=roleName(user.role),roles=(user.roles&&user.roles.length?user.roles:[role]).map(roleName);
        localStorage.setItem('fp_user',JSON.stringify({uid:user.id,email:user.email,name:user.name||user.email,role,roles,authUid:firebaseUser.uid}));
        localStorage.removeItem('fp_redirect');location.replace('dashboard.html');
      }catch(exception){const messages={"auth/invalid-credential":"Email ya password galat hai","auth/user-not-found":"Email nahi mila","auth/wrong-password":"Password galat hai","auth/too-many-requests":"Bahut attempts ho gaye, thodi der baad try karein",disabled:"Ye account disabled hai"};showError(messages[exception.code]||'Login fail: '+(exception.code||'unknown-error'));}
    });
  </script>
</body>
</html>
