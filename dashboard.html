<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FASHION PLACE ERP — Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f1f5f9;color:#0f172a;font-size:14px}
a{color:inherit;text-decoration:none}
.btn{padding:8px 14px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;font-size:13px;font-weight:600;cursor:pointer;color:#334155;font-family:inherit;display:inline-flex;align-items:center;gap:5px}
.btn:hover{background:#f8fafc}
.btn.d{opacity:.5;cursor:wait}
.btn.p{background:#2563eb;color:#fff;border-color:#2563eb}
.btn.p:hover{background:#1d4ed8}
.btn.g{background:#16a34a;color:#fff;border-color:#16a34a}
.btn.r{background:#dc2626;color:#fff;border-color:#dc2626}
.btn.y{background:#f59e0b;color:#fff;border-color:#f59e0b}
.btn.s{background:#0f172a;color:#fff;border-color:#0f172a}
.btn.mini{padding:4px 8px;font-size:11.5px;border-radius:6px}
.inp{width:100%;padding:9px 11px;border:1.5px solid #cbd5e1;border-radius:8px;font-size:13.5px;outline:none;font-family:inherit;background:#fff;color:#0f172a}
.inp:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
select.inp{cursor:pointer}
label{display:block;font-size:11px;font-weight:700;color:#475569;margin-bottom:5px;letter-spacing:.4px;text-transform:uppercase}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.full{grid-column:1/-1}
.hide{display:none!important}
.sb{position:fixed;left:0;top:0;bottom:0;width:236px;background:linear-gradient(180deg,#0f172a,#1e293b);color:#cbd5e1;overflow-y:auto;z-index:40}
.sb header{padding:20px 16px;text-align:center;border-bottom:1px solid #334155}
.sb header img{width:46px;height:46px;border-radius:50%;background:#fff;padding:4px;object-fit:contain}
.sb header h3{color:#fff;font-size:14px;letter-spacing:1.5px;margin-top:9px;font-weight:800}
.sb header p{font-size:10px;color:#64748b;letter-spacing:2px;margin-top:3px}
.sb .who{padding:11px 16px;background:#1e293b;font-size:11.5px;border-bottom:1px solid #334155}
.sb .who b{color:#fff;display:block;font-size:12.5px}
.sb .role{display:inline-block;background:#2563eb;color:#fff;padding:2px 8px;border-radius:20px;font-size:9.5px;font-weight:700;letter-spacing:.5px;margin-top:5px}
.grp{padding:13px 16px 5px;font-size:9.5px;letter-spacing:1.5px;color:#475569;font-weight:800}
.nav{display:block;padding:9px 16px;font-size:13px;color:#cbd5e1;cursor:pointer;border-left:3px solid transparent;display:flex;justify-content:space-between;align-items:center}
.nav:hover{background:#1e293b;color:#fff}
.nav.on{background:#2563eb;color:#fff;border-left-color:#93c5fd;font-weight:600}
.main{margin-left:236px;min-height:100vh}
.tb{height:60px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;gap:12px;padding:0 20px;position:sticky;top:0;z-index:30}
.tb h1{font-size:18px;font-weight:700;flex:1}
.sb2{background:#f1f5f9;border:1px solid #e2e8f0;padding:6px 12px;border-radius:20px;font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#f59e0b}
.dot.ok{background:#16a34a}
.dot.err{background:#dc2626}
.content{padding:20px;max-width:1500px}
.tb2{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.tb2 h3{font-size:17px;font-weight:700;flex:1}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card h4{font-size:14px;font-weight:700;margin-bottom:12px;padding-bottom:9px;border-bottom:2px solid #f1f5f9}
.tw{overflow-x:auto;border-radius:10px;border:1px solid #e2e8f0;background:#fff}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:640px}
th{background:#f8fafc;padding:10px;text-align:left;font-weight:700;font-size:10.5px;color:#475569;text-transform:uppercase;letter-spacing:.4px;border-bottom:2px solid #e2e8f0;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tr:hover td{background:#f8fafc}
.empty{padding:44px;text-align:center;color:#94a3b8;font-size:13.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:15px;border-left:4px solid #2563eb}
.kpi.g{border-left-color:#16a34a}.kpi.y{border-left-color:#f59e0b}.kpi.r{border-left-color:#dc2626}.kpi.m{border-left-color:#7c3aed}
.kpi .v{font-size:21px;font-weight:800;color:#0f172a;line-height:1.2;word-break:break-word}
.kpi .l{font-size:10.5px;color:#64748b;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-top:4px}
.chip{display:inline-block;padding:2.5px 9px;border-radius:20px;font-size:10.5px;font-weight:700;background:#f1f5f9;color:#475569;white-space:nowrap}
.chip.g{background:#dcfce7;color:#15803d}.chip.r{background:#fee2e2;color:#b91c1c}
.chip.y{background:#fef3c7;color:#b45309}.chip.b{background:#dbeafe;color:#1d4ed8}
.chip.m{background:#f3e8ff;color:#6d28d9}
.mask{position:fixed;inset:0;background:rgba(15,23,42,.6);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.mask.show{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:660px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 25px 70px rgba(0,0,0,.4)}
.mhead{padding:16px 20px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between}
.mhead h3{font-size:16px;font-weight:700}
.mbody{padding:20px;overflow-y:auto;flex:1}
.mfoot{padding:13px 20px;border-top:1px solid #e2e8f0;display:flex;gap:9px;justify-content:flex-end}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(90px);background:#0f172a;color:#fff;padding:12px 22px;border-radius:10px;font-size:13.5px;font-weight:600;z-index:200;transition:.25s;max-width:90%;box-shadow:0 8px 25px rgba(0,0,0,.3)}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.s{background:#16a34a}#toast.e{background:#dc2626}
#ban{position:fixed;top:0;left:0;right:0;background:#fef3c7;border-bottom:2px solid #f59e0b;padding:11px 18px;font-size:13px;z-index:150;text-align:center;font-weight:600}
.note{background:#eff6ff;border-left:4px solid #3b82f6;padding:11px 13px;border-radius:8px;font-size:12.5px;line-height:1.7;margin-bottom:13px;color:#1e3a8a}
.note.w{background:#fffbeb;border-left-color:#f59e0b;color:#78350f}
.note.g{background:#f0fdf4;border-left-color:#16a34a;color:#14532d}
.note.r{background:#fef2f2;border-left-color:#dc2626;color:#991b1b}
.tabs{display:flex;gap:5px;margin-bottom:14px;flex-wrap:wrap;border-bottom:2px solid #e2e8f0;padding-bottom:9px}
.tab{padding:7px 14px;border-radius:8px;background:#fff;border:1px solid #e2e8f0;font-size:12.5px;font-weight:600;cursor:pointer;color:#475569}
.tab.on{background:#0f172a;color:#fff;border-color:#0f172a}
.lg{font-size:11px;font-weight:800;color:#475569;letter-spacing:1px;text-transform:uppercase;margin:16px 0 10px;padding-bottom:6px;border-bottom:2px solid #f1f5f9}
.lg:first-child{margin-top:0}
.vsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:9px;margin-bottom:14px}
.vsum>div{background:#f8fafc;border:1px solid #e2e8f0;border-radius:9px;padding:10px}
.vsum span{display:block;font-size:9.5px;color:#64748b;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.vsum b{font-size:14.5px;color:#0f172a;display:block;margin-top:3px;word-break:break-word}
.pf{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px;font-size:12.5px;line-height:1.8}
.pf.good{background:#f0fdf4;border-color:#bbf7d0}.pf.warn{background:#fffbeb;border-color:#fde68a}.pf.bad{background:#fef2f2;border-color:#fecaca}
.line{border:1px solid #e2e8f0;border-radius:9px;padding:11px;margin-bottom:9px;background:#f8fafc}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:11.5px}
.mut{color:#94a3b8;font-size:11.5px}
.mob{display:none}
@media(max-width:820px){.sb{transform:translateX(-100%);transition:.2s}.sb.open{transform:translateX(0)}.main{margin-left:0}.mob{display:inline-flex}.g2,.g3{grid-template-columns:1fr}.kpi .v{font-size:18px}}
/* ═══════════ PRO-LEVEL UI UPGRADE ═══════════ */
:root{--pri:#2563eb;--ink:#0f172a;--line:#e8edf5}
*{-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',Inter,system-ui,-apple-system,sans-serif;background:#eef2f8;background-image:radial-gradient(#dde5f0 1px,transparent 1px);background-size:26px 26px}
::selection{background:#bfdbfe;color:#0f172a}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#c3cdde;border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:#a9b7cc}
::-webkit-scrollbar-track{background:transparent}

/* sidebar */
.sb{width:250px;background:linear-gradient(180deg,#0b1220 0%,#111a2e 60%,#0b1220 100%);border-right:1px solid #1e293b;box-shadow:4px 0 24px rgba(15,23,42,.18)}
.sb header{padding:22px 16px 16px;background:linear-gradient(180deg,rgba(37,99,235,.2),transparent);border-bottom:1px solid #1e293b}
.sb header img{width:54px;height:54px;border:2px solid #334155;box-shadow:0 6px 18px rgba(37,99,235,.35)}
.sb header h3{font-size:15px;letter-spacing:2.5px;background:linear-gradient(90deg,#93c5fd,#e0e7ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sb .who{background:rgba(30,41,59,.7);border:1px solid #334155;border-radius:12px;margin:12px;padding:12px}
.sb .role{background:linear-gradient(90deg,#2563eb,#7c3aed);box-shadow:0 4px 12px rgba(37,99,235,.4)}
.grp{padding:14px 18px 6px;font-size:9px;letter-spacing:2px;color:#64748b}
.nav{margin:2px 8px;padding:9px 12px;border-radius:9px;border-left:0;transition:.15s;position:relative}
.nav:hover{background:#1e293b;transform:translateX(3px)}
.nav.on{background:linear-gradient(90deg,#2563eb,#3b82f6);box-shadow:0 6px 16px rgba(37,99,235,.35);font-weight:700}
.nav.on::before{content:"";position:absolute;left:-8px;top:20%;height:60%;width:3px;background:#93c5fd;border-radius:3px}
.main{margin-left:250px}

/* topbar + global search */
.tb{height:64px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);box-shadow:0 2px 14px rgba(15,23,42,.06);padding:0 22px}
.tb h1{font-size:17.5px}
.sb2{background:#fff;border-color:#e8edf5;box-shadow:0 2px 8px rgba(15,23,42,.05)}
.gs{position:relative;flex:0 1 300px}
.gs .inp{padding:8px 12px 8px 32px;border-radius:22px;border:1.5px solid #e2e8f0;background:#f8fafc;font-size:13px}
.gs::before{content:"\2315";position:absolute;left:12px;top:50%;transform:translateY(-50%) rotate(-20deg);font-size:15px;color:#64748b;font-weight:700;z-index:1}
.gsb{position:absolute;top:46px;left:0;right:0;background:#fff;border:1px solid #e8edf5;border-radius:12px;box-shadow:0 16px 40px rgba(15,23,42,.18);max-height:320px;overflow:auto;z-index:60}
.gsi2{padding:10px 13px;font-size:12.5px;cursor:pointer;border-bottom:1px solid #f1f5f9}
.gsi2:hover{background:#eff6ff;color:#1d4ed8}

/* content + cards */
.content{padding:22px;animation:fadeIn .28s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.card{border:1px solid #e8edf5;border-radius:16px;padding:18px;box-shadow:0 2px 10px rgba(15,23,42,.05);transition:.18s}
.card:hover{box-shadow:0 8px 26px rgba(15,23,42,.09)}
.card h4{font-size:13.5px;display:flex;align-items:center;gap:8px}
.card h4::before{content:"";width:4px;height:15px;border-radius:4px;background:linear-gradient(180deg,#2563eb,#7c3aed);flex:none}
.tb2 h3{font-size:18px}
.tb2 h3::after{content:"";display:block;width:44px;height:3px;border-radius:3px;margin-top:5px;background:linear-gradient(90deg,#2563eb,#7c3aed)}

/* KPI cards */
.kpis{gap:14px}
.kpi{border:1px solid #e8edf5;border-left:0;border-radius:16px;padding:16px 16px 14px;position:relative;overflow:hidden;background:linear-gradient(180deg,#fff,#fbfdff);box-shadow:0 2px 10px rgba(15,23,42,.05);transition:.18s;animation:pop .3s ease}
.kpi:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(15,23,42,.12)}
.kpi::after{content:"";position:absolute;right:-26px;top:-26px;width:84px;height:84px;border-radius:50%;background:rgba(37,99,235,.07)}
.kpi.g::after{background:rgba(22,163,74,.09)}.kpi.y::after{background:rgba(245,158,11,.11)}
.kpi.r::after{background:rgba(220,38,38,.08)}.kpi.m::after{background:rgba(124,58,237,.09)}
.kpi::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--pri);z-index:1}
.kpi.g::before{background:#16a34a}.kpi.y::before{background:#f59e0b}.kpi.r::before{background:#dc2626}.kpi.m::before{background:#7c3aed}
.kpi .v{font-size:22px;letter-spacing:-.5px}

/* tables */
.tw{border-radius:14px;box-shadow:0 2px 10px rgba(15,23,42,.05)}
th{background:linear-gradient(180deg,#f8fafc,#f1f5f9);font-size:10px}
tbody tr:nth-child(even) td{background:#fafcff}
tbody tr:hover td{background:#eff6ff}

/* buttons */
.btn{border-radius:10px;transition:.15s;box-shadow:0 1px 3px rgba(15,23,42,.08);font-weight:700}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(15,23,42,.14)}
.btn:active{transform:translateY(0)}
.btn.p{background:linear-gradient(135deg,#2563eb,#3b82f6);border:0;box-shadow:0 4px 14px rgba(37,99,235,.35)}
.btn.p:hover{background:linear-gradient(135deg,#1d4ed8,#2563eb)}
.btn.g{background:linear-gradient(135deg,#16a34a,#22c55e);border:0;box-shadow:0 4px 14px rgba(22,163,74,.3)}
.btn.r{background:linear-gradient(135deg,#dc2626,#ef4444);border:0;box-shadow:0 4px 14px rgba(220,38,38,.28)}
.btn.y{background:linear-gradient(135deg,#f59e0b,#fbbf24);border:0}
.btn.s{background:linear-gradient(135deg,#0f172a,#334155);border:0}
.inp{border-radius:11px;transition:.15s}
.inp:focus{box-shadow:0 0 0 4px rgba(37,99,235,.12)}
.chip{padding:3.5px 10px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}

/* modal + toast */
.mask{backdrop-filter:blur(5px);background:rgba(11,18,32,.55)}
.modal{border-radius:18px;animation:pop .22s ease;max-width:700px}
.mhead{background:linear-gradient(180deg,#fbfdff,#f8fafc);border-radius:18px 18px 0 0;padding:16px 22px}
.mfoot{background:#fbfdff;border-radius:0 0 18px 18px;padding:14px 22px}
.mfoot .btn.p{padding:9px 20px}
#toast{border-radius:14px;padding:13px 24px;box-shadow:0 14px 34px rgba(15,23,42,.35);border:1px solid rgba(255,255,255,.15)}
#toast::before{content:"\2714 ";font-weight:800}
#toast.e::before{content:"\2715 "}

/* notes, tabs, labels */
.note{border-radius:12px;border:1px solid transparent}
.note.g{border-color:#bbf7d0}.note.w{border-color:#fde68a}.note.r{border-color:#fecaca}
.tabs{border-bottom:0;gap:7px}
.tab{border-radius:20px;padding:7px 16px;box-shadow:0 1px 3px rgba(15,23,42,.08)}
.tab.on{background:linear-gradient(135deg,#0f172a,#334155)}
.lg{border-bottom:0;color:#1d4ed8;letter-spacing:1.4px;position:relative;padding-left:12px}
.lg::before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:4px;border-radius:4px;background:linear-gradient(180deg,#2563eb,#7c3aed)}
.vsum>div{border-radius:12px;background:linear-gradient(180deg,#f8fafc,#fff);transition:.15s}
.vsum>div:hover{border-color:#bfdbfe;box-shadow:0 6px 16px rgba(37,99,235,.1)}
.pf,.line{border-radius:12px}

/* dashboard: bars + quick actions */
.barrow{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;margin:9px 0}
.barrow>span{color:#64748b;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.4px}
.bar{height:12px;background:#f1f5f9;border-radius:8px;overflow:hidden}
.bfill{height:100%;border-radius:8px;transition:width .6s ease;background:linear-gradient(90deg,#2563eb,#60a5fa)}
.bfill.g{background:linear-gradient(90deg,#16a34a,#4ade80)}
.bfill.y{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
.bfill.r{background:linear-gradient(90deg,#dc2626,#f87171)}
.barrow b{font-size:12.5px}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.qbtn{display:flex;flex-direction:column;gap:5px;align-items:flex-start;padding:14px;border:1px solid #e8edf5;border-radius:14px;background:linear-gradient(180deg,#fff,#f8fafc);cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;color:#0f172a;transition:.15s;box-shadow:0 2px 8px rgba(15,23,42,.05);text-align:left}
.qbtn:hover{transform:translateY(-3px);border-color:#bfdbfe;box-shadow:0 10px 24px rgba(37,99,235,.15);color:#1d4ed8}
.qbtn i{font-style:normal;font-size:19px}
.qbtn span{font-size:10px;color:#94a3b8;font-weight:600;text-transform:uppercase;letter-spacing:.5px}

@media(max-width:820px){.sb{width:236px}.main{margin-left:0}.gs{display:none}}
/* avatars + profile hero */
.ava{position:relative;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex:none;overflow:hidden}
.avai{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-weight:800;letter-spacing:.5px;box-shadow:0 4px 12px rgba(37,99,235,.35)}
.avap{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.who{display:flex;gap:10px;align-items:center}
.who .wt{min-width:0}
.prof{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.prof h2{font-size:20px;letter-spacing:-.3px}
.prof .mut{margin:3px 0 8px}
@media print{.sb,.tb,#toast,.mask{display:none!important}.main{margin-left:0}.content{padding:0}}
/* payslip + invoice designs + real print */
.dsw{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dtab{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px;background:#fff}
.dtab th,.dtab td{border:1px solid #cbd5e1;padding:7px 9px;text-align:left}
.dtab th{background:#f1f5f9;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px}
.dtab td.r,.dtab th.r{text-align:right}
.slip-head{text-align:center;border-bottom:3px double #0f172a;padding-bottom:10px;margin-bottom:12px}
.slip-head h2{font-size:19px;letter-spacing:3px}
.slip-mod-head{background:linear-gradient(135deg,#0f172a,#1e3a8a);color:#fff;border-radius:12px;padding:16px 18px;margin-bottom:12px}
.slip-mod-head .mut{color:#cbd5e1}
.slip-compact{max-width:460px;margin:0 auto}
.sign{display:flex;justify-content:space-between;gap:12px;margin-top:26px;font-size:12px;color:#475569}
.sign div{border-top:1px solid #94a3b8;padding-top:4px;min-width:140px;text-align:center}
.inv-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:3px double #0f172a;padding-bottom:10px;margin-bottom:12px}
.inv-terms{font-size:11.5px;color:#475569;margin-top:10px}
.inv-mod-head{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border-radius:12px;padding:16px 18px;margin-bottom:12px}
.inv-compact{max-width:360px;margin:0 auto}
.inv-compact .dtab{font-size:12px}
@media print{
body{background:#fff!important;background-image:none!important}
.noprint{display:none!important}
.mask{position:static!important;background:none!important;backdrop-filter:none!important;display:block!important;padding:0!important}
.modal{box-shadow:none!important;max-width:100%!important;width:100%!important;margin:0!important;border:0!important}

.content{padding:0!important}

<script>
/* ══════════════ FIREBASE ══════════════ */
const CFG={apiKey:"AIzaSyDJsORW6da9s483_0WOB8xvOVoSH0IYmCg",authDomain:"erphubfp.firebaseapp.com",projectId:"erphubfp",storageBucket:"erphubfp.firebasestorage.app",messagingSenderId:"78005918234",appId:"1:78005918234:web:40c523777b1a503eaa4fa3",measurementId:"G-390YVTRPTT"};
firebase.initializeApp(CFG);
const auth=firebase.auth(),db=firebase.firestore(),TS=firebase.firestore.FieldValue.serverTimestamp(),INCR=firebase.firestore.FieldValue.increment;

/* ══════════════ HELPERS ══════════════ */
const $=i=>document.getElementById(i);
const num=v=>Number(v)||0;
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const money=v=>"\u20B9"+(num(v)).toLocaleString("en-IN",{maximumFractionDigits:2});
function numWords(n){n=Math.round(num(n));if(isNaN(n))n=0;if(n===0)return"Zero";var a=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];var b=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];var two=function(x){return x<20?a[x]:b[Math.floor(x/10)]+(x%10?" "+a[x%10]:"")};var three=function(x){var h=Math.floor(x/100),r=x%100;return (h?a[h]+" Hundred"+(r?" ":""):"")+(r?two(r):"")};var s="";var cr=Math.floor(n/1e7);n%=1e7;var lk=Math.floor(n/1e5);n%=1e5;var th=Math.floor(n/1e3);n%=1e3;if(cr)s+=three(cr)+" Crore ";if(lk)s+=two(lk)+" Lakh ";if(th)s+=two(th)+" Thousand ";if(n)s+=three(n);return s.trim()||"Zero"}
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const nowTime=()=>{const d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};
const fd=t=>{if(!t)return"-";const d=t.toDate?t.toDate():new Date(t);return isNaN(d)?"-":d.toLocaleDateString("en-IN")};
const ft=t=>{if(!t)return"-";const d=t.toDate?t.toDate():new Date(t);return isNaN(d)?"-":d.toLocaleString("en-IN",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})};
const chip=(t,c)=>'<span class="chip '+(c||"")+'">'+esc(t)+'</span>';
const kp=(v,l,c)=>'<div class="kpi '+(c||"")+'"><div class="v">'+v+'</div><div class="l">'+l+'</div></div>';
const tbl=(h,r,e)=>!r.length?'<div class="tw"><div class="empty">'+e+'</div></div>':'<div class="tw"><table><thead><tr>'+h.map(x=>'<th>'+x+'</th>').join("")+'</tr></thead><tbody>'+r.map(x=>'<tr>'+x.map(c=>'<td>'+c+'</td>').join("")+'</tr>').join("")+'</tbody></table></div>';
const gv=i=>{const e=$(i);return e?(e.value||"").trim():""};
let mSave=null;
function openM(t,h,fn,st){$("mT").textContent=t;$("mB").innerHTML=h;const b=$("mS");b.textContent=st||"Save";b.classList.remove("d");b.style.display=fn?"":"none";mSave=fn;$("mask").classList.add("show")}
$("mS").onclick=async()=>{const f=mSave;if(!f||window._saving)return;window._saving=true;try{window._lastErr=false;await f()}catch(e){window._lastErr=true;toast("Error: "+(e.message||e),"e")}window._saving=false;if(!window._lastErr&&mSave)closeM()};
function closeM(){$("mask").classList.remove("show");mSave=null}
function toast(m,c){window._lastErr=(c==="e");const t=$("toast");t.innerHTML=m;t.className="show"+(c?" "+c:"");clearTimeout(window._tt);window._tt=setTimeout(()=>t.className="",3200)}
/* ============ GLOBAL FILTERS (user / date / month) ============ */
let F={user:"",from:"",to:"",month:"",year:""};
function docDate(d){const v=d.payDate||d.createdAt||d.date||null;if(!v)return null;if(v.toDate){try{return v.toDate()}catch(e){return null}}if(typeof v==="string"&&/^\d{4}-\d{2}/.test(v)){const t=new Date(v.length===7?v+"-01":v);return isNaN(t)?null:t}return null}
function fOK(d){if(F.user&&(d.by||"")!==F.user)return false;const dt=docDate(d);if(F.from&&(!dt||dt<new Date(F.from+"T00:00:00")))return false;if(F.to&&(!dt||dt>new Date(F.to+"T23:59:59")))return false;if(F.month){if(!dt)return false;if(dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")!==F.month)return false}if(F.year&&(!dt||dt.getFullYear()!==+F.year))return false;return true}
function fUsers(){return [...new Set([].concat(S.sales,S.purchases,S.payments,S.expenses).map(x=>x.by).filter(Boolean))].sort()}
function filterBar(){const us=fUsers();const act=[F.user,F.from&&("From "+F.from),F.to&&("To "+F.to),F.month&&("Month "+F.month),F.year&&("Year "+F.year)].filter(Boolean).join(" \u00b7 ");return '<div class="card fbar"><div class="fgrid">'+'<div><label>User</label><select class="inp" id="f_user" onchange="fSet()"><option value="">All Users</option>'+us.map(u=>'<option'+(F.user===u?" selected":"")+'>'+esc(u)+'</option>').join("")+'</select></div>'+'<div><label>From Date</label><input class="inp" id="f_from" type="date" value="'+F.from+'" onchange="fSet()"></div>'+'<div><label>To Date</label><input class="inp" id="f_to" type="date" value="'+F.to+'" onchange="fSet()"></div>'+'<div><label>Month</label><input class="inp" id="f_month" type="month" value="'+F.month+'" onchange="fSetM()"></div>'+'<div><label>Year</label><select class="inp" id="f_year" onchange="fSetY()"><option value="">All Years</option>'+fYears().map(y=>'<option'+(F.year===y?" selected":"")+'>'+y+'</option>').join("")+'</select></div>'+'<div><label>&nbsp;</label><div class="btns"><button class="btn" onclick="fReset()">Reset</button><button class="btn p" onclick="window.print()">Print / PDF</button></div></div>'+'</div>'+(act?'<div class="fact">Showing: <b>'+esc(act)+'</b></div>':'')+'</div>'}
window.fSet=()=>{F.user=gv("f_user");F.from=gv("f_from");F.to=gv("f_to");if(F.from||F.to){F.month="";F.year=""}go(cur)};
window.fSetM=()=>{F.month=gv("f_month");if(F.month){F.from="";F.to="";F.year=""}go(cur)};
window.fReset=()=>{F={user:"",from:"",to:"",month:"",year:""};go(cur)};
window.fSetY=()=>{F.year=gv("f_year");if(F.year){F.from="";F.to="";F.month=""}go(cur)};
function fYears(){const y={};[].concat(S.sales,S.purchases,S.payments,S.expenses).forEach(d=>{const t=docDate(d);if(t)y[t.getFullYear()]=1});const r=Object.keys(y).sort().reverse();const cy=String(new Date().getFullYear());if(r.indexOf(cy)<0)r.unshift(cy);return r}
function lowStockN(){const b=(S.settings||[]).find(x=>x.id==="barcode")||{};const n=num(b.lowStock);return n>0?n:5}
function lowItems(){const n=lowStockN();return S.products.filter(p=>num(p.qty)<=n)};
async function run(f,s){try{$("mS").classList.add("d");await f();closeM();toast(s||"Done \u2713","s")}catch(e){toast("Error: "+(e.message||e),"e")}finally{$("mS").classList.remove("d")}}
function nextNo(p){return p+"-"+Date.now().toString().slice(-6)}
function daysAgo(t){if(!t)return 0;const d=t.toDate?t.toDate():new Date(t);return Math.floor((Date.now()-d.getTime())/86400000)}

/* ══════════════ STATE ══════════════ */
const COLS=["products","suppliers","customers","employees","users","sales","purchases","ledgerEntries","payments","expenses","attendance","leave","payroll","stockMovements","loans","settings"];
const S={};COLS.forEach(c=>S[c]=[]);
let ME={uid:"",email:"",name:"",role:"employee",empId:""},cur="",booted=false;

/* ══════════════ 5 ROLES ══════════════ */
const NAV=[
  ["MAIN",[["dashboard","Dashboard"],["myprofile","My Profile"]]],
  ["HRMS",[["employees","Employees"],["attendance","Attendance"],["leave","Leave"],["payroll","Payroll"],["loans","Loans"]]],
  ["STORE",[["products","Products"],["stock","Stock Movement"],["barcode","Barcode"]]],
  ["ORDERS",[["suppliers","Suppliers"],["purchases","Purchase Bills"]]],
  ["SALES",[["customers","Customers"],["sales","Sales Invoices"],["ebilling","Employee Billing"]]],

  ["SYSTEM",[["users","Users"],["settings","Settings"]]]
];

/* ══════════════ LANGUAGE (English default / Hindi option) ══════════════ */
let LANG=(function(){try{return localStorage.getItem("fp_lang")==="hi"?"hi":"en"}catch(e){return"en"}})();
const LBL_HI={"Dashboard":"डैशबोर्ड","My Profile":"मेरी प्रोफाइल","Employees":"कर्मचारी","Attendance":"उपस्थिति","Leave":"अवकाश","Payroll":"वेतन","Loans":"ऋण","Products":"उत्पाद","Stock Movement":"स्टॉक मूवमेंट","Barcode":"बारकोड","Suppliers":"सप्लायर","Purchase Bills":"खरीद बिल","Customers":"ग्राहक","Sales Invoices":"सेल इनवॉइस","Employee Billing":"कर्मचारी बिलिंग","Bill Payments":"बिल भुगतान","Party Ledgers":"पार्टी लेजर","Accounts":"खाते","Verification":"सत्यापन","Reports":"रिपोर्ट","Users":"उपयोगकर्ता","Settings":"सेटिंग्स"};
const GRP_HI={"MAIN":"मुख्य","HRMS":"एचआरएमएस","STORE":"स्टोर","ORDERS":"ऑर्डर","SALES":"सेल्स","ACCOUNTS":"अकाउंट्स","REPORTING":"रिपोर्टिंग","SYSTEM":"सिस्टम"};
const tx=s=>LANG==="hi"?(LBL_HI[s]||s):s;
const gx=s=>LANG==="hi"?(GRP_HI[s]||s):s;
window.setLang=l=>{LANG=l==="hi"?"hi":"en";try{localStorage.setItem("fp_lang",LANG)}catch(e){}
  buildNav();if(booted&&cur)go(cur);toast(LANG==="hi"?"भाषा बदल गई \u2713":"Language changed \u2713","s")};
const ACCESS={
  admin:ALL,
  manager:["dashboard","myprofile","employees","products","stock","barcode","suppliers","purchases","customers","sales","ebilling","payments","ledgers","accounts","verification","reports","users","settings"],
  hr:["dashboard","myprofile","employees","attendance","leave","payroll","loans","ebilling","reports"],
  accountant:["dashboard","myprofile","sales","purchases","payments","ledgers","accounts","verification","reports"],
  employee:["dashboard","myprofile","attendance","leave","payroll","loans","ebilling","sales","verification"]
};
const can=m=>((ACCESS[ME.role]||ALL).includes(m));
const canHR=()=>["admin","hr"].includes(ME.role);

const HRMSG="Only <b>Admin</b> and <b>HR</b> can modify these records.";
function guard(m){if(!auth.currentUser){toast("Session expired \u2014 please log in again","e");setTimeout(()=>location.replace("index.html"),900);return false}return true}
function guardHR(m){if(!guard(m))return false;if(!canHR()){toast(HRMSG,"e");return false}return true}

/* ══════════════ NAV BUILD ══════════════ */
function buildNav(){
  let h="";
  NAV.forEach(g=>{
    const items=g[1].filter(i=>can(i[0]));
    if(!items.length)return;
    h+='<div class="grp">'+gx(g[0])+'</div>';
    items.forEach(i=>{h+='<a class="nav" data-go="'+i[0]+'" onclick="go(\''+i[0]+'\')">'+tx(i[1])+'</a>'});
  });
  $("nav").innerHTML=h;
}
function go(s){
  if(!can(s))s="dashboard";
  cur=s;$("pt").textContent=tx(TITLE[s])||tx("Dashboard");
  document.querySelectorAll(".nav").forEach(n=>n.classList.toggle("on",n.dataset.go===s));
  document.getElementById("sb").classList.remove("open");
  (PAGE[s]||PAGE.dashboard)();
}
window.go=go;

/* ══════════════ GLOBAL SEARCH ══════════════ */
window.gSearch=()=>{
  const q=gv("gsi").toLowerCase(),box=$("gsb");
  if(q.length<2){box.classList.add("hide");box.innerHTML="";return}
  const res=[];
  const look=(arr,field,lab,page)=>arr.forEach(x=>{if(res.length<14&&String(x[field]||"").toLowerCase().indexOf(q)>=0)res.push({label:lab+" \u00b7 "+(x[field]||"-"),p:page})});
  look(S.customers,"name","Customer","customers");look(S.customers,"phone","Customer","customers");
  look(S.products,"name","Product","products");look(S.products,"barcode","Product","products");
  look(S.employees,"name","Employee","employees");look(S.employees,"empId","Employee","employees");
  look(S.sales,"no","Sale Invoice","sales");look(S.sales,"cusName","Sale Invoice","sales");
  look(S.purchases,"no","Purchase","purchases");
  look(S.users,"name","User","users");
  window._gs=res;
  box.innerHTML=res.length?res.map((r,i)=>'<div class="gsi2" onclick="gPick('+i+')">'+esc(r.label)+'</div>').join(""):'<div class="gsi2" style="color:#94a3b8">No results found</div>';
  box.classList.remove("hide");
};
window.gPick=i=>{
  const r=(window._gs||[])[i];if(!r)return;
  go(r.p);$("gsi").value="";$("gsb").classList.add("hide");
};
window.gKey=e=>{
  if(e.key==="Enter")gPick(0);
  if(e.key==="Escape"){$("gsb").classList.add("hide");e.target.blur()}
};
document.addEventListener("click",e=>{
  const g=document.querySelector(".gs");
  if(g&&!g.contains(e.target))$("gsb").classList.add("hide");
});
document.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&String(e.key).toLowerCase()==="k"){e.preventDefault();const i=$("gsi");if(i)i.focus()}
});

/* ══════════════ SYNC ══════════════ */
const PAGE={};
async function sync(){
  const done=[];let fail=0;
  await Promise.all(COLS.map(async c=>{
    try{const s=await db.collection(c).get();S[c]=s.docs.map(d=>Object.assign({id:d.id},d.data()));done.push(c)}
    catch(e){S[c]=[];fail++}
  }));
  const d=$("sDot"),t=$("sTxt");
  if(fail===0){d.className="dot ok";t.textContent="Synced "+done.length+" tables"}
  else if(done.length){d.className="dot";t.textContent="Partial ("+done.length+"/"+COLS.length+")"}
  else{d.className="dot err";t.textContent="Sync failed"}
  try{localStorage.setItem("fp_data",JSON.stringify(S))}catch(e){}
}
window.syncNow=async()=>{await sync();go(cur);toast("Data refreshed \u2713","s")};
window.logout=()=>{if(confirm("Log out?"))auth.signOut().then(()=>{localStorage.removeItem("fp_user");location.replace("index.html")})};

/* ══════════════ SESSION AUTO-LOCK (idle) ══════════════ */
let _idleT=null,_idleW=null,_idleLast=0;
function idleReset(){
  const n=Date.now();if(n-_idleLast<30000)return;_idleLast=n;
  clearTimeout(_idleT);clearTimeout(_idleW);
  _idleW=setTimeout(()=>toast("Session locks in 2 minutes \u2014 move cursor or press a key","w"),18*60*1000);
  _idleT=setTimeout(()=>{
    auth.signOut().then(()=>{localStorage.removeItem("fp_user");location.replace("index.html")}).catch(()=>{});
  },20*60*1000);
}
["mousemove","keydown","click","touchstart"].forEach(ev=>document.addEventListener(ev,idleReset,{passive:true}));
idleReset();

/* ══════════════ DASHBOARD ══════════════ */
PAGE.dashboard=()=>{
  const fS=S.sales.filter(fOK),fP=S.purchases.filter(fOK),fE=S.expenses.filter(fOK);
  const sT=fS.reduce((a,b)=>a+num(b.total),0);
  const pT=fP.reduce((a,b)=>a+num(b.total),0);
  const sP=fS.reduce((a,b)=>a+num(b.paid),0);
  const pP=fP.reduce((a,b)=>a+num(b.paid),0);
  const rec=sT-sP,pay=pT-pP;
  const stock=S.products.reduce((a,b)=>a+num(b.qty)*num(b.cost),0);
  const exp=fE.reduce((a,b)=>a+num(b.amount),0);
  const emps=S.employees.length;
  const todayA=S.attendance.filter(a=>a.date===today());
  const pendPay=S.payments.filter(p=>p.status!=="Verified"&&p.status!=="Rejected"&&fOK(p));
  const pendLv=S.leave.filter(l=>l.status==="Pending"&&fOK(l));
  const pendLo=S.loans.filter(l=>l.status==="Pending"&&fOK(l));

  let h="";
  const biz=["admin","manager","accountant"].includes(ME.role);
  if(biz)h+=filterBar();
  const lows=lowItems();
  if(biz&&lows.length)h+='<div class="card"><h4>Low Stock Alert ('+lows.length+')</h4>'+tbl(["Product","Qty in Hand"],lows.slice(0,10).map(p=>["<b>"+esc(p.name)+"</b>",'<b style="color:#b91c1c">'+esc(String(p.qty))+"</b>"]),"")+'<div class="mut" style="margin:6px 0">Threshold: '+lowStockN()+" (Settings \u2192 Barcode)"+'</div><div><button class="btn mini" onclick="go(\'products\')">View Products</button></div>';

  /* ---- role-specific hero ---- */
  if(ME.role==="accountant"){
    h+='<div class="kpis">'+kp(money(sT),"Sell Amount","g")+kp(money(pT),"Purchase Amount","y")+kp(money(stock),"Stock Value","m")+
       kp(money(rec),"To Receive","b")+kp(money(pay),"To Pay","r")+'</div>';
  }else if(ME.role==="employee"){
    const me0=myEmp();
    h+='<div class="card prof">'+ava(me0.name||ME.name,me0.photo,64)+'<div><h2>Welcome, '+esc(me0.name||ME.name)+'</h2><div class="mut">'+esc(me0.desig||"")+(me0.desig&&me0.empId?" \u00b7 ":"")+esc(me0.empId||"")+'</div>'+chip(ROLES[ME.role]||ME.role,"b")+'</div></div>';
    const myP=S.payroll.find(p=>p.empId===ME.empId);
    const myA=S.attendance.filter(a=>a.empId===ME.empId);
    h+='<div class="kpis">'+
       kp(myA.length,"My Attendance (month)","b")+
       kp(S.leave.filter(l=>l.empId===ME.empId).length,"My Leaves","y")+
       kp(myP?money(myP.net):"-","My Last Salary","g")+
       kp(S.loans.filter(l=>l.empId===ME.empId&&l.status==="Approved").length,"My Loans","m")+
       '</div>';
  }else if(ME.role==="hr"){
    h+='<div class="kpis">'+
       kp(emps,"Employees","b")+kp(todayA.length,"Present Today","g")+
       kp(pendLv.length,"Pending Leaves","y")+kp(S.payroll.filter(p=>p.status!=="Paid").length,"Salary Due","r")+
       kp(pendLo.length,"Pending Loans","m")+'</div>';

       kp(money(sT),"Sell Amount","g")+kp(money(pT),"Purchase Amount","y")+
       kp(emps,"Employees","b")+kp(pendLv.length+pendLo.length,"Pending Proposals","y")+
       kp(pendPay.length,"Pending Payments","r")+'</div>';
  }else{
    h+='<div class="kpis">'+
       kp(money(sT),"Sell Amount","g")+kp(money(pT),"Purchase Amount","y")+
       kp(money(stock),"Stock Value","m")+kp(emps,"Employees","b")+
       kp(money(exp),"Expenses","r")+kp(pendPay.length,"Pending Verify","y")+'</div>';
  }

  /* ---- pro: business overview bars ---- */
  const mx=Math.max(sT,pT,exp,1);
  const bar=(l,v,c)=>'<div class="barrow"><span>'+l+'</span><div class="bar"><div class="bfill '+c+'" style="width:'+Math.max(2,Math.round(v/mx*100))+'%"></div></div><b>'+money(v)+'</b></div>';

     bar("Sales",sT,"g")+bar("Purchases",pT,"y")+bar("Expenses",exp,"r")+

  /* ---- pro: quick actions ---- */
  const qas=[];
  if(can("sales"))qas.push(["\uD83D\uDD3E","New Sales Invoice","openSale","Bill / invoice"]);
  if(can("purchases"))qas.push(["\uD83D\uDCE6","New Purchase","openPurch","Supplier bill"]);
  if(canHR())qas.push(["\uD83D\uDC65","Add Employee","addEmp","Profile + login"]);
  if(can("attendance"))qas.push(["\uD83D\uDDD5","Mark Attendance","markAtt","Today's attendance"]);
  if(can("accounts"))qas.push(["\uD83D\uDCB8","Add Expense","addExp","Expense entry"]);
  if(can("customers"))qas.push(["\uD83E\uDD1D","New Customer","addCus","Customer master"]);
  if(qas.length)h+='<div class="card"><h4>Quick Actions</h4><div class="qa">'+
     qas.map(q=>'<button class="qbtn" onclick="'+q[2]+'()"><i>'+q[0]+'</i>'+q[1]+'<span>'+q[3]+'</span></button>').join("")+'</div></div>';

  /* ---- pending proposals (actionable) ---- */
  if(["admin","manager","hr"].includes(ME.role)){
    const all=[...S.leave.filter(l=>l.status==="Pending").map(l=>({t:"Leave",w:l.empName,n:l.reason,d:l.from&&l.to})),
               ...S.loans.filter(l=>l.status==="Pending").map(l=>({t:"Loan",w:l.empName,n:l.reason,d:money(l.amount)}))];
    if(all.length)h+='<div class="card"><h4>&#128188; Pending Your Approval</h4>'+tbl(["Type","Employee","Detail","Action"],
      all.map(x=>[chip(x.t,x.t==="Loan"?"y":"b"),esc(x.w),esc(String(x.n||"-")),
        '<button class="btn g mini" onclick="actProposal(\''+x.t+'\',\'review\')">Review</button>']), "")+'</div>';
  }

  /* ---- bills with payment pending (the user's key ask) ---- */
  const dueBills=[...S.sales.filter(x=>num(x.total)-num(x.paid)>0.01).map(x=>({t:"Sale",no:x.no,p:x.cusName,tot:x.total,pd:x.paid,dt:x.createdAt,id:x.id})),
                  ...S.purchases.filter(x=>num(x.total)-num(x.paid)>0.01).map(x=>({t:"Purchase",no:x.no,p:x.supName,tot:x.total,pd:x.paid,dt:x.createdAt,id:x.id}))]
                  .sort((a,b)=>daysAgo(b.dt)-daysAgo(a.dt));
  if(dueBills.length&&can("payments")){
    h+='<div class="card"><h4>&#128968; Bills Pending Payment</h4>'+
      tbl(["Type","Bill No","Party","Bill Date","Total","Paid","Due","Age","Action"],
        dueBills.slice(0,10).map(b=>{
          const d=num(b.tot)-num(b.pd),ag=daysAgo(b.dt);
          return[chip(b.t==="Sale"?"Receive":"Pay",b.t==="Sale"?"g":"r"),"<b>"+esc(b.no)+"</b>",esc(b.p),
            fd(b.dt),money(b.tot),money(b.pd),'<b style="color:#b45309">'+money(d)+"</b>",
            (ag>30?chip(ag+" days","r"):chip(ag+" days",ag>15?"y":"b")),
            '<button class="btn p mini" onclick="openPay(\''+b.t+'\',\''+b.id+'\')">Payment Dalo</button>'];
        }),
        "No bills pending payment \u2014 all clear \u2713")+
      '<div class="mut" style="margin-top:10px">Total pending: <b>'+dueBills.length+' bills</b> &nbsp;|&nbsp; Also listed on the <a href="#" onclick="go(\'payments\');return false" style="color:#2563eb;font-weight:700">Bill Payments</a> page.</div></div>';
  }

  /* ---- recent activity ---- */
  const act=[...S.sales.map(x=>({i:"\u2713",t:"Sale "+x.no+" \u2014 "+x.cusName,v:money(x.total),d:x.createdAt})),
             ...S.purchases.map(x=>({i:"\u2717",t:"Purchase "+x.no+" \u2014 "+x.supName,v:money(x.total),d:x.createdAt})),
             ...S.expenses.map(x=>({i:"\u20b9",t:x.cat+" \u2014 "+(x.desc||""),v:money(x.amount),d:x.createdAt}))]
            .sort((a,b)=>((b.d&&b.d.toDate?b.d.toDate():0)-(a.d&&a.d.toDate?a.d.toDate():0))).slice(0,12);
  h+='<div class="card"><h4>&#128337; Recent Activity</h4>'+tbl(["","Activity","Amount","Date"],
    act.map(a=>[chip(a.i),esc(a.t),"<b>"+a.v+"</b>",fd(a.d)]),"No activity yet")+'</div>';

  $("content").innerHTML=h;
};

window.viewSlip=(id,d)=>{
  const p=S.payroll.find(x=>x.id===id);if(!p)return;
  if(!d){d="classic";try{d=localStorage.getItem("fp_slipD")||d}catch(e){}}
  try{localStorage.setItem("fp_slipD",d)}catch(e){}
  const e=S.employees.find(x=>x.empId&&x.empId===p.empId)||{};
  const tax=(S.settings||[]).find(x=>x.id==="tax")||{};
  const co=tax.company||"FASHION PLACE";
  const er=[["Basic",p.basic],["HRA",p.hra],["Other Allowance",p.allow]].filter(r=>num(r[1])!==0);
  const dr=[["PF Deduction",p.pf],["TDS",p.tds]].filter(r=>num(r[1])!==0);
  const gross=num(p.full)||(num(p.basic)+num(p.hra)+num(p.allow));
  const ded=+(gross-num(p.net)).toFixed(2);
  const info=[["Employee",p.empName],["Emp ID",p.empId||"-"],["Designation",e.desig||"-"],["Department",e.dept||"-"],["Month",p.month],["Paid Days",p.paidDays],["Present",p.present],["Absent",p.absent],["Bank A/C",p.accNo||"-"],["IFSC",p.ifsc||"-"],["Status",p.status||"Generated"]];
  let erows="";const n=Math.max(er.length,dr.length,1);
  for(let i=0;i<n;i++)erows+="<tr><td>"+esc(er[i]?er[i][0]:"\u2014")+'</td><td class="r">'+(er[i]?money(er[i][1]):"\u2014")+"</td><td>"+esc(dr[i]?dr[i][0]:"\u2014")+'</td><td class="r">'+(dr[i]?money(dr[i][1]):"\u2014")+"</td></tr>";
  const etab='<table class="dtab"><tr><th>Earnings</th><th class="r">Amount</th><th>Deductions</th><th class="r">Amount</th></tr>'+erows+'<tr><td><b>Gross Total</b></td><td class="r"><b>'+money(gross)+'</b></td><td><b>Total Deductions</b></td><td class="r"><b>'+money(ded)+'</b></td></tr></table>';
  const words='<div class="pf"><b>Net Pay: '+money(p.net)+'</b> ('+numWords(p.net)+' Rupees Only)</div>';
  const sign='<div class="sign"><div>Employee Signature</div><div>Authorised Signatory</div></div>';
  const sw='<div class="dsw noprint" style="margin-bottom:12px">'+["classic","modern","compact"].map(x=>'<button class="btn mini'+(d===x?" p":"")+'" onclick="viewSlip(\''+id+'\',\''+x+'\')">'+x[0].toUpperCase()+x.slice(1)+'</button>').join("")+'<button class="btn mini p" style="margin-left:auto" onclick="window.print()">Print</button></div>';
  let body="";
  if(d==="modern"){
    body=sw+'<div class="slip-mod-head"><div style="font-size:11px;letter-spacing:2px;opacity:.85">'+esc(co)+' \u00b7 PAYSLIP</div><div style="font-size:19px;font-weight:800">'+esc(p.empName)+'</div><div style="opacity:.85;font-size:12px">'+esc(p.month)+' \u00b7 '+esc(p.empId||"")+'</div></div>'+'<div class="vsum">'+info.map(r=>vc(r[0],r[1])).join("")+'</div>'+etab+words+sign;
  }else if(d==="compact"){
    body=sw+'<div class="slip-compact"><div class="slip-head"><h2>'+esc(co)+'</h2><div class="mut">PAYSLIP \u00b7 '+esc(p.month)+'</div></div>'+'<div class="vsum">'+vc("Employee",p.empName)+vc("Emp ID",p.empId||"-")+vc("Paid Days",p.paidDays)+vc("Present",p.present)+vc("Absent",p.absent)+'</div>'+etab+words+sign+'</div>';
  }else{
    body=sw+'<div class="slip-head"><h2>'+esc(co)+'</h2><div class="mut">PAYSLIP FOR THE MONTH OF '+esc(p.month)+'</div></div>'+'<div class="vsum">'+info.map(r=>vc(r[0],r[1])).join("")+'</div>'+etab+words+sign;
  }
  openM("Payslip \u2014 "+esc(p.month)+" \u2014 "+esc(p.empName),body,null,"Close");
  $("mS").style.display="none";
};

window.editEmp=id=>{

window.empLogin=id=>{
  if(!guardHR("employees"))return;
  const e=S.employees.find(x=>x.id===id);if(!e)return;

   '<div class="note">Without a server, Firebase does not allow directly changing another user&#39;s password. Two options:<br>'+
   '<b>1) New Login ID</b> &rarr; a new Firebase login is created and the new password is shown here.<br>'+
   '<b>2) Password only</b> &rarr; a reset email is sent; the employee sets it themselves.</div>'+

   async()=>{
     const em=gv("ne").toLowerCase(),p1=gv("np"),p2=gv("np2");

     if(p1&&p1.length<6)return toast("Password kam se kam 6 character","e");
     if(changed){
       const dup=S.employees.find(x=>x.id!==id&&String(x.email||"").toLowerCase()===em);
       if(dup)return toast("Ye email dusre ka hai: "+dup.name,"e");
       const pw=p1||genPass();
       const cr=await createAuthUser(em,pw);
       if(!cr.ok){
         if(cr.error==="auth/email-already-in-use")return toast("This email is already registered in Firebase. Use another email.","e");
         return toast("Login creation failed: "+(cr.error||"unknown"),"e");
       }
       const b=db.batch();
       b.update(db.collection("employees").doc(id),{email:em,updatedAt:TS});
       if(u.id)b.update(db.collection("users").doc(u.id),{email:em,authUid:cr.uid,updatedAt:TS});
       if(e.authUid)b.set(db.collection("users_by_uid").doc(e.authUid),{status:"Blocked",blockedAt:TS},{merge:true});
       b.set(db.collection("users_by_uid").doc(cr.uid),{uid:cr.uid,name:e.name,email:em,role:e.role||"employee",empId:e.empId||"",status:"Active",updatedAt:TS});
       await b.commit();
       await sync();
       closeM();
       openM("\u2705 Naya Login Ban Gaya",
        '<div class="note g" style="font-size:15px"><b>'+esc(e.name)+'</b> ka naya login ready hai:</div>'+
        '<div class="vsum">'+vc("Login ID",em)+vc("Password",pw)+vc("Purana Login","Blocked \u2705")+'</div>'+
        '<div class="note w">Share this password with the <b>employee personally</b>. Passwords are never stored in the system.</div>',null,"OK");
       $("mS").style.display="none";
     }else{
       try{await auth.sendPasswordResetEmail(String(e.email).toLowerCase());toast("Reset email bhej di: "+e.email,"s")}
       catch(x){toast("Email could not be sent: "+(x.code||x.message),"e")}
     }
   },"Apply");

window.genPay=()=>{
  if(!guardHR("payroll"))return;
  if(!S.employees.length)return toast("Add an employee first","e");
  const m=new Date().toISOString().slice(0,7);
  openM("Salary Generate \u2014 "+m,
   '<div class="note">Employee salary is auto-calculated from attendance (based on Marked Days in a 30-day month).</div>'+
   '<div class="g2"><div><label>Month *</label><input class="inp" id="py_m" value="'+m+'"></div>'+
   '<div><label>Paid Days (blank = auto)</label><input class="inp" id="py_d" type="number" placeholder="auto"></div></div>',
   async()=>{
     const mo=gv("py_m"),od=gv("py_d");
     if(!/^\d{4}-\d{2}$/.test(mo))return toast("Month format must be YYYY-MM","e");
     const b=db.batch();let n=0;
     for(const e of S.employees){
       if(e.status==="Inactive")continue;
       const ex=S.payroll.find(p=>p.empId===e.empId&&p.month===mo);
       if(ex)continue;
       const att=S.attendance.filter(a=>a.empId===e.empId);
       const marked=att.length?att:[];
       const pres=marked.filter(a=>a.status==="Present").length;
       const half=marked.filter(a=>a.status==="Half").length;
       const abs=marked.filter(a=>a.status==="Absent").length;
       const pd=od?num(od):(marked.length?Math.min(30,pres+half*.5):30);
       const full=num(e.basic)+num(e.hra)+num(e.allow);
       const net=+Math.round(full*pd/30-num(e.pf)-num(e.tds)).toFixed(2);
       b.set(db.collection("payroll").doc(),{month:mo,empId:e.empId||"",empName:e.name,basic:num(e.basic),hra:num(e.hra),
         allow:num(e.allow),pf:num(e.pf),tds:num(e.tds),full:+full.toFixed(2),markedDays:marked.length,present:pres,absent:abs,
         paidDays:pd,net,status:"Generated",bankName:e.bankName||"",accNo:e.accNo||"",ifsc:e.ifsc||"",upiId:e.upiId||"",by:ME.name,createdAt:TS});
       n++;
     }
     await b.commit();await sync();go("payroll");
     toast(n?n+" payslips generated":"Payslips for this month already exist","s");
   },"Generate");
};

PAGE.payments=()=>{
  const rec=[...S.sales.filter(x=>num(x.total)-num(x.paid)>0.01).map(x=>({t:"Sale",no:x.no,p:x.cusName,tot:x.total,pd:x.paid,dt:x.createdAt,id:x.id,mode:x.mode})),
             ...S.purchases.filter(x=>num(x.total)-num(x.paid)>0.01).map(x=>({t:"Purchase",no:x.no,p:x.supName,tot:x.total,pd:x.paid,dt:x.createdAt,id:x.id,mode:x.mode}))]
            .sort((a,b)=>daysAgo(b.dt)-daysAgo(a.dt));
  const hist=S.payments.slice().sort((a,b)=>daysAgo(b.createdAt)-daysAgo(a.createdAt)).slice(0,60);
  const totR=rec.filter(b=>b.t==="Sale").reduce((a,b)=>a+(num(b.tot)-num(b.pd)),0);
  const totP=rec.filter(b=>b.t==="Purchase").reduce((a,b)=>a+(num(b.tot)-num(b.pd)),0);
  $("content").innerHTML=
  '<div class="tb2"><h3>&#128968; Bill Payments <span class="mut">(Bills with pending payment)</span></h3></div>'+
  '<div class="kpis">'+kp(money(totR),"To Receive","g")+kp(money(totP),"To Pay","r")+
   kp(rec.length,"Pending Bills","y")+kp(money(totR-totP),"Net Position","b")+'</div>'+
  (canFin()?'':'<div class="note w">View only. Payment entries are made by <b>Admin / Accounts</b>.</div>')+
  '<div class="card"><h4>&#128203; Pending Bills</h4>'+
  tbl(["Type","Bill No","Party","Bill Date","Mode","Bill Total","Already Paid","Due","Age","Action"],
    rec.map(b=>{const d=num(b.tot)-num(b.pd),ag=daysAgo(b.dt);
      return[chip(b.t==="Sale"?"Receive":"Pay",b.t==="Sale"?"g":"r"),"<b>"+esc(b.no)+"</b>","<b>"+esc(b.p)+"</b>",fd(b.dt),
        esc(b.mode||"-"),money(b.tot),money(b.pd),'<b style="color:#b45309">'+money(d)+"</b>",
        (ag>30?chip(ag+" days","r"):chip(ag+" days",ag>15?"y":"b")),
        canFin()?'<button class="btn p mini" onclick="openPay(\''+b.t+'\',\''+b.id+'\')">Payment Dalo</button>':"-"];
    }),"<b>All bills clear \u2013 nothing pending \u2713</b>")+
  '<div class="mut" style="margin-top:10px">When a payment arrives or is made &rarr; click <b>Payment Dalo</b> here &rarr; the bill <b>balance</b> decreases and a Pending entry appears under Verification.</div></div>'+
  '<div class="card"><h4>&#128337; Payment History</h4>'+
  tbl(["Date","Type","Ref","Party","Bill Total","Amount","Mode","Txn ID","Status","Verified By"],
    hist.map(p=>["<b>"+esc(p.refNo||"-")+"</b>",chip(p.type||"-",p.type==="Purchase"?"r":p.type==="Employee"?"y":"g"),esc(p.refNo||"-"),
      esc(p.pname||"-"),money(p.billAmount),money(p.amount),esc(p.mode||"-"),
      '<span class="mono">'+esc(p.transactionId||"-")+"</span>",
      chip(p.status||"Pending",p.status==="Verified"?"g":p.status==="Rejected"?"r":"y"),
      esc(p.verifiedBy||"-")]),
    "No payment entries")+'</div>';
};
window.openPay=(type,id)=>{
  if(!guardFin("payments"))return;
  const src=type==="Sale"?S.sales:S.purchases;
  const b=src.find(x=>x.id===id);if(!b)return;
  const party=type==="Sale"?b.cusName:b.supName;
  const pid=type==="Sale"?b.cid:b.sid;
  const due=+(num(b.total)-num(b.paid)).toFixed(2);
  window._pb={type,id,pid,party,no:b.no,tot:num(b.total),paid:num(b.paid)};
  const modal=()=>{
    const d=+(num(b.total)-num(b.paid)).toFixed(2);
    const amt=num(gv("pb_a"));
    const bal=+(d-amt).toFixed(2);
    $("pb_h").className="pf "+(amt<=0?"bad":bal<0?"bad":bal>0?"warn":"good");
    $("pb_h").innerHTML=(type==="Sale"?"Receive":"Pay")+" (Lena/Lena hua): <b>"+money(d)+"</b> &nbsp;|&nbsp; "
      +"This entry: <b>"+money(amt)+"</b> &nbsp;|&nbsp; "+(bal<0?'<b style="color:#b91c1c">Excess '+money(-bal)+"</b>"
        :bal>0?'<b style="color:#b45309">Balance due: '+money(bal)+"</b>":'<b style="color:#16a34a">Bill puri tarah paid \u2713</b>');
  };
  openM((type==="Sale"?"Payment RECEIVE":"Payment PAY")+" \u2014 "+esc(b.no),
   '<div class="vsum">'+vc("Party",party)+vc("Bill No",b.no)+vc("Bill Total",money(b.total))+
    vc("Already "+esc(type==="Sale"?"Received":"Paid"),money(b.paid))+vc("Due",money(due))+'</div>'+
   '<div class="g2">'+
   '<div><label>Amount * ('+esc(type==="Sale"?"Receive":"Pay")+')</label><input class="inp" id="pb_a" type="number" value="'+due.toFixed(2)+'" oninput="PBH()"></div>'+
   '<div><label>Date *</label><input class="inp" id="pb_d" type="date" value="'+today()+'"></div>'+
   '<div class="full"><label>Mode</label><select class="inp" id="pb_m"><option>Cash</option><option>UPI</option><option>Card</option><option>Bank Transfer</option><option>Cheque</option></select></div>'+
   '<div><label>Transaction / Txn ID</label><input class="inp" id="pb_tx" placeholder="UTR / Ref no (required for Bank/UPI)"></div>'+
   '<div><label>Note</label><input class="inp" id="pb_n"></div>'+
   '</div>'+
   '<div class="btns" style="margin-top:9px;display:flex;gap:8px"><button class="btn" onclick="PBFull()">Pay Full Balance</button><button class="btn" onclick="PBHalf()">Half (50%)</button></div>'+
   '<div class="pf" id="pb_h" style="margin-top:12px"></div>'+
   '<div class="note g" style="margin-top:12px">On saving: the bill <b>balance</b> decreases &rarr; it is removed from the <b>Bill Payments</b> list &rarr; a Pending entry is created under <b>Verification</b> &rarr; the Party <b>Ledger</b> is updated.</div>',
   async()=>{
     const p=window._pb;
     const amt=+num(gv("pb_a")).toFixed(2);
     if(amt<=0)return toast("Enter amount","e");
     const newPaid=+(p.paid+amt).toFixed(2);
     if(newPaid>p.tot)return toast("Amount is more than bill total \u2014 "+money(amt)+" max","e");
     const mode=gv("pb_m"),txn=gv("pb_tx"),note=gv("pb_n"),dt=gv("pb_d");
     if(mode!=="Cash"&&!txn)return toast("Transaction ID required for Bank/UPI/Card (needed for verification)","e");
     const bal=+(p.tot-newPaid).toFixed(2);
     if(!confirm((type==="Sale"?"RECEIVE":"PAY")+" CONFIRM KAREIN?\n\nParty : "+p.party+
       "\nBill   : "+p.no+"\nAmount : "+money(amt)+"\nMode   : "+mode+"\nDate   : "+dt+
       (txn?"\nTxn ID : "+txn:"")+
       "\n\nBalance after this: "+money(bal)+(bal>0?" (balance due)":" (bill fully paid)")))return toast("Cancelled","w");
     const b2=db.batch();
     b2.update(db.collection(type==="Sale"?"sales":"purchases").doc(p.id),{paid:newPaid,due:bal,status:bal<=0?"Paid":"Partial",lastPayDate:dt});
     b2.set(db.collection("payments").doc(),{type,refNo:p.no,pid:p.pid||"",pname:p.party,amount:amt,billAmount:p.tot,
       dueBefore:+(p.tot-p.paid).toFixed(2),mode,transactionId:txn,description:note||((type==="Sale"?"Payment received":"Payment made")+" for "+p.no),
       payDate:dt,verifyType:mode==="Cash"?"case":"normal",status:"Pending",by:ME.name,createdAt:TS});
     b2.set(db.collection("ledgerEntries").doc(),{ptype:type==="Sale"?"customer":"supplier",pid:p.pid||"",pname:p.party,
       debit:type==="Purchase"?amt:0,credit:type==="Sale"?amt:0,bal,refNo:p.no,note,by:ME.name,createdAt:TS});
     b2.set(db.collection("expenses").doc(),{cat:type==="Purchase"?"Supplier Payment":"Sale Receipt",
       desc:(type==="Sale"?"Received":"Paid")+" "+p.no+" - "+p.party,amount:amt,mode,refNo:p.no,by:ME.name,createdAt:TS});
     await b2.commit();
     await sync();go("payments");
     toast((type==="Sale"?"Received":"Paid")+" "+money(amt)+" \u2014 balance now "+money(bal)+" \u2713","s");
   },"Save Payment");
  window.PBH=modal;window.PBFull=()=>{$("pb_a").value=due.toFixed(2);modal()};
  window.PBHalf=()=>{$("pb_a").value=(due/2).toFixed(2);modal()};
  modal();
};

/* ══════════════ BILL FORMS (purchase + sale) ══════════════ */
const MODES=["Cash","UPI","Card","Bank Transfer","Credit"];
function billItemsUI(pfx){
  return '<div id="'+pfx+'items"></div><button class="btn" onclick="addLine(\''+pfx+'\')">+ Item Row</button>';
}
window.addLine=pfx=>{
  const box=$(pfx+"items");if(!box)return;
  const opts='<option value="">-- product --</option>'+S.products.map(p=>'<option value="'+p.id+'">'+esc(p.name)+" (stock "+num(p.qty)+")</option>").join("");
  const d=document.createElement("div");d.className="line";
  d.innerHTML='<div class="g3" style="grid-template-columns:2fr 1fr 1fr 1fr auto;gap:8px">'+
    '<select class="inp li-p">'+opts+'</select>'+
    '<input class="inp li-q" type="number" value="1" placeholder="Qty">'+
    '<input class="inp li-pz" type="number" value="0" placeholder="Price">'+
    '<input class="inp li-am" readonly placeholder="Amount">'+
    '<button class="btn r mini" onclick="this.parentNode.parentNode.parentNode.remove()">&times;</button></div>';
  box.appendChild(d);
  const upd=()=>{
    [...box.querySelectorAll(".line")].forEach(r=>{
      const p=S.products.find(x=>x.id===r.querySelector(".li-p").value);
      const q=num(r.querySelector(".li-q").value),pr=num(r.querySelector(".li-pz").value);
      if(p&&!r.querySelector(".li-pz").dataset.t){r.querySelector(".li-pz").value=num(p.price);r.querySelector(".li-pz").dataset.t="1";r.querySelector(".li-am").value=(num(p.price)*q).toFixed(2)}
      r.querySelector(".li-am").value=(pr*q).toFixed(2);
    });
  };
  d.querySelector(".li-p").addEventListener("change",()=>{const p=S.products.find(x=>x.id===d.querySelector(".li-p").value);
    if(p){d.querySelector(".li-pz").value=num(p.price);d.querySelector(".li-pz").dataset.t="1"}upd()});
  d.querySelector(".li-q").addEventListener("input",upd);
  d.querySelector(".li-pz").addEventListener("input",upd);
  upd();
};
const readItems=pfx=>{
  const out=[];
  [...$(pfx+"items").querySelectorAll(".line")].forEach(r=>{
    const p=S.products.find(x=>x.id===r.querySelector(".li-p").value);
    const q=num(r.querySelector(".li-q").value),pr=num(r.querySelector(".li-pz").value);
    if(p&&q>0)out.push({pid:p.id,pname:p.name,qty:q,price:pr,amt:+(pr*q).toFixed(2),stock:num(p.qty)});
  });
  return out;
};
function billTotals(pfx,items){
  const sub=+items.reduce((a,b)=>a+b.amt,0).toFixed(2);
  const g=num($(pfx+"gst")?$(pfx+"gst").value:0);
  const tot=+(sub+sub*g/100).toFixed(2);
  const pd=num($(pfx+"paid")?$(pfx+"paid").value:0);
  return{sub,gst:g,tot,paid:+pd.toFixed(2),due:+(tot-pd).toFixed(2)};
}
function billHint(pfx){
  const items=readItems(pfx);if(!items.length)return;
  const t=billTotals(pfx,items);
  if($(pfx+"h"))$(pfx+"h").innerHTML="Subtotal <b>"+money(t.sub)+"</b> &nbsp;|&nbsp; GST "+t.gst+"% &nbsp;|&nbsp; <b>Bill Total "+money(t.tot)+"</b> &nbsp;|&nbsp; Paid <b>"+money(t.paid)+"</b> &nbsp;|&nbsp; "
    +(t.due>0?'<b style="color:#b45309">Due '+money(t.due)+"</b>":t.due<0?'<b style="color:#b91c1c">Extra '+money(-t.due)+"</b>":'<b style="color:#16a34a">Full paid \u2713</b>');
}

window.printBill=(kind,id,d)=>{
  const src=kind==="sale"?S.sales:S.purchases;
  const b=src.find(x=>x.id===id);if(!b)return;
  const isS=kind==="sale";
  if(!d){d="gst";try{d=localStorage.getItem("fp_billD")||d}catch(e){}}
  try{localStorage.setItem("fp_billD",d)}catch(e){}
  const tax=(S.settings||[]).find(x=>x.id==="tax")||{};
  const co=tax.company||"FASHION PLACE",gi=tax.gstin||"";
  const party=isS?b.cusName:b.supName,ph=isS?(b.cusPhone||""):"";
  const items=(b.items||[]);
  const gstAmt=+(num(b.total)-num(b.sub)).toFixed(2);
  const due=+(num(b.total)-num(b.paid)).toFixed(2);
  const itab=tbl(["#","Item","Qty","Rate","Amount"],items.map((i,n)=>[n+1,esc(i.pname),esc(String(i.qty)),money(i.price),money(i.amt)]),"No items");
  const tots='<table class="dtab"><tr><td>Subtotal</td><td class="r">'+money(b.sub)+'</td></tr><tr><td>GST ('+esc(String(b.gst||0))+'%)</td><td class="r">'+money(gstAmt)+'</td></tr><tr><td><b>Grand Total</b></td><td class="r"><b>'+money(b.total)+'</b></td></tr><tr><td>Paid ('+esc(b.mode||"-")+')</td><td class="r">'+money(b.paid)+'</td></tr><tr><td><b>Balance Due</b></td><td class="r"><b>'+money(due)+'</b></td></tr></table>';
  const words='<div class="pf"><b>Amount in words:</b> '+numWords(b.total)+' Rupees Only</div>';
  const terms='<div class="inv-terms">Terms: Goods once sold will not be taken back. Payment due as per balance above. Subject to local jurisdiction.</div>';
  const sign='<div class="sign"><div>Customer Signature</div><div>Authorised Signatory</div></div>';
  const sw='<div class="dsw noprint" style="margin-bottom:12px">'+["gst","modern","compact"].map(x=>'<button class="btn mini'+(d===x?" p":"")+'" onclick="printBill(\''+kind+'\',\''+id+'\',\''+x+'\')">'+(x==="gst"?"GST Bill":x[0].toUpperCase()+x.slice(1))+'</button>').join("")+'<button class="btn mini g" style="margin-left:auto" onclick="waBill(\''+kind+'\',\''+id+'\')">WhatsApp PDF</button>'+'<button class="btn mini p" onclick="window.print()">Print</button></div>';
  const meta='<div class="vsum">'+vc(isS?"Bill To":"Supplier",party+(ph?" ("+ph+")":""))+(isS&&b.empName?vc("Salesman",b.empName):"")+vc("Bill No",b.no)+vc("Date",fd(b.createdAt))+vc("Payment Mode",b.mode||"-")+vc("Status",b.status||"Pending")+'</div>';
  let body="";
  if(d==="modern"){
    body=sw+'<div class="inv-mod-head"><div style="font-size:11px;letter-spacing:2px;opacity:.85">'+esc(co)+(gi?" \u00b7 GSTIN "+esc(gi):"")+'</div><div style="font-size:19px;font-weight:800">'+(isS?"TAX INVOICE ":"PURCHASE BILL ")+esc(b.no)+'</div><div style="opacity:.85;font-size:12px">'+fd(b.createdAt)+' \u00b7 '+esc(party)+'</div></div>'+meta+itab+tots+words+sign;
  }else if(d==="compact"){
    body=sw+'<div class="inv-compact"><div class="slip-head"><h2 style="font-size:16px">'+esc(co)+'</h2><div class="mut">'+(isS?"TAX INVOICE":"PURCHASE BILL")+' \u00b7 '+esc(b.no)+'<br>'+fd(b.createdAt)+' \u00b7 '+esc(party)+'</div></div>'+itab+tots+words+sign+'</div>';
  }else{
    body=sw+'<div class="inv-head"><div><div style="font-size:20px;font-weight:800;letter-spacing:3px">'+esc(co)+'</div>'+(gi?'<div class="mut">GSTIN: '+esc(gi)+'</div>':'')+'</div><div style="text-align:right"><b>'+(isS?"TAX INVOICE":"PURCHASE BILL")+'</b><div class="mut">No: '+esc(b.no)+'<br>Date: '+fd(b.createdAt)+'</div></div></div>'+meta+itab+tots+words+sign;
  }
  openM((isS?"INVOICE":"PURCHASE")+" \u2014 "+esc(b.no),body,null,"Close");
  $("mS").style.display="none";
};

function waPhone(ph){ph=String(ph||"").replace(/\D/g,"");if(ph.length===10)ph="91"+ph;return ph}
function waMsg(b,isS,co){
  const due=+(num(b.total)-num(b.paid)).toFixed(2);
  return ["*"+co+"*",(isS?"TAX INVOICE ":"PURCHASE BILL ")+b.no,
   "Date: "+fd(b.createdAt),
   (isS?"Customer: "+b.cusName:"Supplier: "+b.supName),
   "Items: "+(b.items||[]).length+" | Total: "+money(b.total)+" | Paid: "+money(b.paid)+" | Due: "+money(due),
   "In words: "+numWords(b.total)+" Rupees Only",
   "- Sent from "+co+" ERP"].join("\n");
}
function pdfEsc(s){s=String(s==null?"":s).split("\u20B9").join("Rs.").split("\u2013").join("-").split("\u2014").join("-").split("\u00B7").join("-");let o="";for(let i=0;i<s.length;i++){const ch=s[i],cd=s.charCodeAt(i);if(ch==="("||ch===")"||ch==="\\")o+="\\"+ch;else if(cd<32||cd>126)o+="?";else o+=ch}return o}
function billPDF(b,isS,co,gi){
  const T=(f,s,x,y,t)=>"BT /"+f+" "+s+" Tf "+x+" "+y+" Td ("+pdfEsc(t)+") Tj ET\n";
  let y=792,ct="";
  ct+=T("F2",18,50,y,co);y-=20;
  if(gi){ct+=T("F1",10,50,y,"GSTIN: "+gi);y-=15}
  ct+=T("F1",10,50,y,"--------------------------------------------------------------------------------");y-=22;
  ct+=T("F2",13,50,y,(isS?"TAX INVOICE":"PURCHASE BILL"));y-=18;
  ct+=T("F1",11,50,y,"No: "+b.no+"    Date: "+fd(b.createdAt));y-=15;
  ct+=T("F1",11,50,y,(isS?"Customer: "+b.cusName:"Supplier: "+b.supName));y-=15;
  if(isS&&b.cusPhone){ct+=T("F1",11,50,y,"Phone: "+b.cusPhone);y-=15}
  if(isS&&b.empName){ct+=T("F1",11,50,y,"Salesman: "+b.empName);y-=15}
  ct+=T("F1",11,50,y,"Mode: "+(b.mode||"-")+"    Status: "+(b.status||"Pending"));y-=20;
  ct+=T("F2",10,50,y,"#");ct+=T("F2",10,70,y,"Item");ct+=T("F2",10,330,y,"Qty");ct+=T("F2",10,380,y,"Rate");ct+=T("F2",10,460,y,"Amount");y-=14;
  (b.items||[]).slice(0,24).forEach((it,i)=>{
    ct+=T("F1",10,50,y,String(i+1));
    ct+=T("F1",10,70,y,String(it.pname||"").slice(0,38));
    ct+=T("F1",10,330,y,String(it.qty));
    ct+=T("F1",10,380,y,money(it.price));
    ct+=T("F1",10,460,y,money(it.amt));
    y-=14;});
  if((b.items||[]).length>24){ct+=T("F1",10,50,y,"(+"+((b.items||[]).length-24)+" more items - see full bill in ERP)");y-=14}
  y-=6;
  const gstAmt=+(num(b.total)-num(b.sub)).toFixed(2);
  const due=+(num(b.total)-num(b.paid)).toFixed(2);
  ct+=T("F1",11,50,y,"Subtotal:");ct+=T("F1",11,460,y,money(b.sub));y-=15;
  ct+=T("F1",11,50,y,"GST ("+(b.gst||0)+"%):");ct+=T("F1",11,460,y,money(gstAmt));y-=15;
  ct+=T("F2",12,50,y,"Grand Total:");ct+=T("F2",12,460,y,money(b.total));y-=16;
  ct+=T("F1",11,50,y,"Paid:");ct+=T("F1",11,460,y,money(b.paid));y-=15;
  ct+=T("F2",11,50,y,"Balance Due:");ct+=T("F2",11,460,y,money(due));y-=20;
  const ww=(numWords(b.total)+" Rupees Only").match(/.{1,90}(\s|$)/g)||["-"];
  ww.slice(0,3).forEach(wl=>{ct+=T("F1",10,50,y,"Amount in words: "+wl);y-=13});
  y-=10;
  ct+=T("F1",10,50,y,"Customer Sign: _______________");ct+=T("F1",10,330,y,"Authorised Sign: _______________");y-=20;
  ct+=T("F1",9,50,y,"Generated by "+co+" ERP");
  const o1="1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj\n";
  const o2="2 0 obj<</Type/Pages/Kids[3 0 R]/Count 1>>endobj\n";
  const o3="3 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Resources<</Font<</F1 4 0 R/F2 6 0 R>>>>/Contents 5 0 R>>endobj\n";
  const o4="4 0 obj<</Type/Font/Subtype/Type1/BaseFont/Helvetica>>endobj\n";
  const o5="5 0 obj<</Length "+ct.length+">>stream\n"+ct+"endstream\nendobj\n";
  const o6="6 0 obj<</Type/Font/Subtype/Type1/BaseFont/Helvetica-Bold>>endobj\n";
  let pdf="%PDF-1.4\n";const offs=[0];
  [o1,o2,o3,o4,o5,o6].forEach((o,i)=>{offs[i+1]=pdf.length;pdf+=o});
  const xp=pdf.length;
  pdf+="xref\n0 7\n0000000000 65535 f \n";
  for(let i=1;i<=6;i++)pdf+=String(offs[i]).padStart(10,"0")+" 00000 n \n";
  pdf+="trailer<</Size 7/Root 1 0 R>>\nstartxref\n"+xp+"\n%%EOF";
  return new Blob([pdf],{type:"application/pdf"});
}
window.waBill=async(kind,id)=>{
  const src=kind==="sale"?S.sales:S.purchases;
  const b=src.find(x=>x.id===id);if(!b)return;
  const isS=kind==="sale";
  const tax=(S.settings||[]).find(x=>x.id==="tax")||{};
  const co=tax.company||"FASHION PLACE",gi=tax.gstin||"";
  let ph=isS?waPhone(b.cusPhone):waPhone(b.supPhone);
  if(ph.length<10){const inp=prompt("WhatsApp number (with country code):",ph||"91");if(!inp)return toast("Cancelled","w");ph=waPhone(inp);if(ph.length<10)return toast("Invalid number","e")}
  const blob=billPDF(b,isS,co,gi);
  const fname=String(b.no||"bill").replace(/[^\w\-]+/g,"_")+".pdf";
  try{
    const file=new File([blob],fname,{type:"application/pdf"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:fname,text:waMsg(b,isS,co)});
      return toast("Shared \u2014 choose WhatsApp \u2713","s");
    }
  }catch(e){if(e&&e.name==="AbortError")return toast("Cancelled","w")}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fname;document.body.appendChild(a);a.click();
  setTimeout(()=>{try{URL.revokeObjectURL(a.href);a.remove()}catch(e){}},4000);
  window.open("https://wa.me/"+ph+"?text="+encodeURIComponent(waMsg(b,isS,co)),"_blank");
  toast("PDF downloaded \u2014 attach it in WhatsApp chat \u2713","s");
};

PAGE.ledgers=()=>{
  const map={};
  S.ledgerEntries.forEach(e=>{
    const k=(e.ptype||"other")+"|"+(e.pid||"")+"|"+(e.pname||"-");
    if(!map[k])map[k]={ptype:e.ptype,pid:e.pid,pname:e.pname,dr:0,cr:0,n:0,last:null};
    map[k].dr+=num(e.debit);map[k].cr+=num(e.credit);map[k].n++;
    if(!map[k].last||daysAgo(e.createdAt)<daysAgo(map[k].last))map[k].last=e.createdAt;
  });
  let rows=Object.values(map).map(m=>({...m,bal:m.dr-m.cr})).sort((a,b)=>b.bal-a.bal);
  const _lt=window._ledT||"all",_lq=(window._ledQ||"").toLowerCase();
  if(_lt!=="all")rows=rows.filter(r=>r.ptype===_lt);
  if(_lq)rows=rows.filter(r=>(r.pname||"").toLowerCase().indexOf(_lq)>=0);
  $("content").innerHTML=
  '<div class="tb2"><h3>&#128200; Party Ledgers</h3>'+'<input class="inp" id="ledQ" placeholder="Search party..." style="max-width:230px" value="'+esc(window._ledQ||"")+'" oninput="ledQSet()"></div>'+
  '<div class="kpis">'+kp(rows.length,"Parties","b")+
   kp(money(rows.filter(r=>r.bal>0&&r.ptype==="customer").reduce((a,b)=>a+b.bal,0)),"To Receive","g")+
   kp(money(rows.filter(r=>r.bal>0&&r.ptype==="supplier").reduce((a,b)=>a+b.bal,0)),"To Pay","r")+
   kp(money(S.ledgerEntries.length),"Entries","m")+'</div>'+
  '<div class="tabs">'+["all","customer","supplier"].map(f=>'<button class="tab'+(_lt===f?" on":"")+'" onclick="ledTSet(\''+f+'\')">'+f.toUpperCase()+"</button>").join("")+'</div>'+
  tbl(["Party","Type","Entries","Total Billed","Total Paid","Balance","Status","Last Entry"],

      esc(String(r.n)),money(r.dr),money(r.cr),'<b style="color:'+(r.bal>0?"#b45309":"#16a34a")+'">'+money(r.bal)+"</b>",
      r.bal>0?chip(r.bal>0?"Due":"Clear","y"):chip("Clear","g"),fd(r.last)]),

PAGE.verification=()=>{

  }

  '<div class="tb2"><h3>&#9989; Payment Verification</h3>'+

window.rejPay=async id=>{
  if(!canVerify())return;
  const p=S.payments.find(x=>x.id===id);if(!p)return;
  if(!confirm("REJECT PAYMENT?\n\n"+p.pname+"\nAmount: "+money(p.amount)))return;
  try{await db.collection("payments").doc(id).update({status:"Rejected",verifiedBy:ME.name,verifiedAt:TS,verifiedRole:ME.role});
    await sync();go("verification");toast("Payment rejected","e")}
  catch(e){toast("Error: "+(e.message||e),"e")}
};
window.bulkVerify=()=>{
  if(!canVerify())return;
  const cash=S.payments.filter(p=>p.status!=="Verified"&&p.status!=="Rejected"&&p.mode==="Cash");
  if(!cash.length)return toast("No pending CASH payments \u2014 bulk verify is for cash only","e");
  if(!confirm("BULK VERIFY "+cash.length+" CASH payments?\n\nAmount total: "+money(cash.reduce((a,b)=>a+num(b.amount),0))+
    "\n\nVerified By: "+ME.name+"\n\n(Bank/UPI/Card are verified one by one \u2014 Transaction ID is required.)"))return;
  const b=db.batch();
  cash.forEach(p=>b.update(db.collection("payments").doc(p.id),{status:"Verified",verifiedBy:ME.name,verifiedAt:TS,
    verifiedRole:ME.role,verifyType:"case",description:(p.description||"")+" (bulk cash verify)"}));
  run(()=>b.commit(),cash.length+" cash payments verified \u2713");
  sync().then(()=>go("verification"));
};

/* ══════════════ PASSWORD GENERATION ══════════════ */
function genPass(){const c="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%";let p="";
  for(let i=0;i<11;i++)p+=c[Math.floor(Math.random()*c.length)];
  return p+Math.floor(Math.random()*10);}
window.genPass=genPass;

/* ══════════════ CREATE AUTH USER (secondary app — main session safe) ══════════════ */
let _helper=null;
function helperApp(){
  let a=null;
  try{a=firebase.app("fp_helper")}catch(e){a=null}
  if(!a){
    try{a=firebase.initializeApp(CFG,"fp_helper")}
    catch(e){try{a=firebase.app("fp_helper")}catch(e2){a=null}}
  }
  return a;
}
function helperAuth(){
  if(_helper)return _helper;
  const a=helperApp();if(!a)return null;
  try{_helper=a.auth();return _helper}catch(e){_helper=null;return null}
}
async function dropHelper(){
  _helper=null;
  try{let a=null;try{a=firebase.app("fp_helper")}catch(e){}
    if(a)await a.delete();
  }catch(e){}
}
async function createAuthUser(email,pw){
  const a=helperAuth();
  if(!a)return{ok:false,error:"helper-app-failed"};
  let uid="";
  try{const cr=await a.createUserWithEmailAndPassword(email,pw);uid=cr.user.uid}
  catch(err){await dropHelper();return{ok:false,error:err.code||err.message}}
  try{await a.signOut()}catch(e){}
  await dropHelper();
  return uid?{ok:true,uid}:{ok:false,error:"uid-not-returned"};
}
window.createAuthUser=createAuthUser;

      b.className="note w";
      b.style.cssText="position:fixed;top:6px;left:50%;transform:translateX(-50%);z-index:9998;max-width:94vw;box-shadow:0 6px 24px rgba(0,0,0,.25);text-align:left;max-height:70vh;overflow:auto";
      b.innerHTML="&#9888; Role <b>employee</b> found &#8212; your <b>role document was not found</b>. Actual Firestore reading below (copy this):<br><br>"+
        "Login UID: <code>"+esc(u.uid)+"</code><br>Login email: <code>"+esc(u.email||"")+"</code><br>"+
        probe.map(esc).join("<br>")+
        "<br><br><b>Fix:</b> In Firestore, create the <code>users_by_uid</code> collection &#8594; Document ID = <code>"+esc(u.uid)+
        "</code> &#8594; with fields <code>role</code> = <code>admin</code>, <code>email</code> = <code>"+esc(u.email||"")+"</code>, <code>status</code> = <code>Active</code>.";
      document.body.appendChild(b);
    }catch(e){}
  }
  function roleErrHasPerm(x){return!!x&&(x.indexOf("permission")>=0||x.indexOf("PERMISSION")>=0)}
  if(rerr.indexOf("permission")>=0||rerr.indexOf("PERMISSION")>=0){
    try{
      const b=document.createElement("div");
      b.className="note r";
      b.style.cssText="position:fixed;top:6px;left:50%;transform:translateX(-50%);z-index:9999;max-width:94vw;box-shadow:0 6px 24px rgba(0,0,0,.28);text-align:left";
      b.innerHTML="&#9888; Firestore <b>Rules</b> are not published &#8212; role/data cannot be read, so everything shows as <b>Employee</b>.<br>"+
        "Firebase Console &gt; <b>Firestore Database &gt; Rules</b> me ye paste karke <b>Publish</b> dabayein:<br>"+
        "<code style=\"background:#0f172a;color:#7dd3fc;padding:2px 6px;border-radius:4px\">allow read, write: if request.auth != null;</code> &nbsp; then <b>refresh</b> the page.";
      document.body.appendChild(b);
    }catch(e){}
  }
  if(String(status).toLowerCase()==="blocked"){
    $("content").innerHTML='<div class="note r" style="margin-top:30px">&#10007; Your login is <b>Blocked</b>. Please contact Admin.</div>';
    return;
  }
  ME={uid:u.uid,email:u.email||"",name,role,empId,authUid:u.uid};
  localStorage.setItem("fp_user",JSON.stringify(ME));
  $("uName").textContent=name;$("uEmail").textContent=u.email;$("uRole").textContent=ROLES[role]||role;
  $("uAv").innerHTML=ava(name,"",40);
  /* instant paint from local cache — no waiting, no lag */
  try{const cached=JSON.parse(localStorage.getItem("fp_data")||"null");
    if(cached)Object.keys(cached).forEach(k=>{if(Array.isArray(cached[k])&&S[k])S[k]=cached[k]})}catch(e){}
  buildNav();
  go(location.hash.replace("#","")||"dashboard");
  booted=true;
  await sync();
  try{const lg=(S.settings||[]).find(x=>x.id==="lang");if(lg&&lg.lang&&!localStorage.getItem("fp_lang")){LANG=lg.lang==="hi"?"hi":"en";localStorage.setItem("fp_lang",LANG);buildNav()}}catch(e){}
  if(cur)go(cur);
  paintUserAvatar();
});
</script>
